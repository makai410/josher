[mono]
org = "rust-lang"
repo = "rust"
url = "git@github.com:rust-lang/rust.git"              # or https://github.com/rust-lang/rust.git
filter = ":/compiler/rustc_public:prefix=rustc_public"

[subtree]
org = "rust-lang"
repo = "rustc_public"
# We assume that we're right in the subtree repo
filter = ":/rustc_public:prefix=rustc_public"
